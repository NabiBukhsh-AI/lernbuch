# Local Postgres for development: `docker compose up -d`.
#
# The Neon serverless driver speaks WebSocket rather than the Postgres wire
# protocol over TCP, so a wsproxy sits in front of Postgres the way Neon's own
# edge does. src/db/client.ts routes to it whenever DATABASE_URL points at
# localhost.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lernbuch
    volumes:
      - pgdata:/var/lib/postgresql/data

  wsproxy:
    image: ghcr.io/neondatabase/wsproxy:latest
    environment:
      APPEND_PORT: postgres:5432
      ALLOW_ADDR_REGEX: '.*'
      LOG_TRAFFIC: 'true'
    ports:
      - '5433:80'
    depends_on:
      - postgres

volumes:
  pgdata:
